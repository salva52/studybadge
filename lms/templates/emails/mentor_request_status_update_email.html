<div style="background-color: #f4f7f6; padding: 40px 20px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);">
        <!-- Header -->
        <div style="background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); padding: 32px 24px; text-align: center; border-bottom: 1px solid #bfdbfe;">
            <img src="{{ frappe.utils.get_url() }}/assets/lms/images/studybadge/studybadge-logo.png" alt="StudyBadge" style="max-height: 48px; margin: 0 auto; display: block;">
        </div>
        
        <!-- Content -->
        <div style="padding: 40px 32px; color: #334155; font-size: 16px; line-height: 1.7;">
            <div>
              <p>{{ _("Dear") }} {{ member_name }},</p>
              <br>
              <p>{{ _("Your request to join us as a mentor for the course") }} {{ course }} {{ _("has been") }} {{ status }}.</p>
              <br>
              <p>{{ _("Thanks and Regards") }},</p>
              <p>{{ _("Team School") }}.</p>
            </div>
        </div>
        
        <!-- Footer -->
        <div style="background-color: #f8fafc; padding: 32px 24px; text-align: center; font-size: 13px; color: #64748b; border-top: 1px solid #f1f5f9;">
            <p style="margin: 0; font-weight: 600; color: #0f172a; font-size: 15px;">StudyBadge</p>
            <p style="margin: 6px 0 0 0;">Aprende habilidades reales. Obtén certificados verificables.</p>
            <div style="margin-top: 20px;">
                <a href="{{ frappe.utils.get_url() }}" style="background-color: #3b82f6; color: #ffffff; padding: 10px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; display: inline-block;">Visitar Plataforma</a>
            </div>
        </div>
    </div>
</div>
