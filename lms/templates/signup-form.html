{% set custom_signup_content = frappe.db.get_single_value("LMS Settings", "custom_signup_content") %}
<form class="signup-form" role="form">
    <div class="page-card-body">
        <div class="form-group">
            <label class="sb-login-label" for="signup_fullname"> {{ _("Nombre Completo") }} </label>
            <div class="name-field">
                <input type="text" id="signup_fullname" class="form-control sb-login-input" placeholder="{{ _('María Pérez') }}"
                required autofocus>
                <svg class="field-icon user-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
        </div>
        <div class="form-group">
            <label class="sb-login-label" for="signup_email"> {{ _("Correo electrónico") }} </label>
            <div class="email-field">
                <input type="email" id="signup_email" class="form-control sb-login-input"
                placeholder="{{ _('juan@example.com') }}" required>
                <svg class="field-icon email-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </div>
        </div>
        <div class="form-group">
            <label class="sb-login-label" for="signup_ref_code"> {{ _("Código de referido (Opcional)") }} </label>
            <div class="name-field">
                <input type="text" id="signup_ref_code" class="form-control sb-login-input" placeholder="{{ _('Ej: salvador') }}">
                <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 12 20 22 4 22 4 12"></polyline>
                    <rect x="2" y="7" width="20" height="5"></rect>
                    <line x1="12" y1="22" x2="12" y2="7"></line>
                    <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
                    <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
                </svg>
            </div>
        </div>

        {% if frappe.db.get_single_value("LMS Settings", "user_category") %}
        <div class="form-group">
            <label class="sb-login-label" for="user_category"> {{ _("Categoría de Usuario") }} </label>
            <div class="category-field">
                <select type="text" id="user_category" data-fieldname="user_category" style="color: var(--text-light)"
                class="input-with-feedback form-control sb-login-input ellipsis" data-fieldtype="Select" required>
                    <option value=""> {{ _("Selecciona tu categoría") }} </option>
                    <option value="Business Owner"> {{ _("Dueño de Negocio") }} </option>
                    <option value="Manager (Sales/Marketing/Customer)"> {{ _("Gerente / Administrador") }} </option>
                    <option value="Employee"> {{ _("Empleado") }} </option>
                    <option value="Student"> {{ _("Estudiante") }} </option>
                    <option value="Freelancer/Just looking"> {{ _("Freelancer / Particular") }} </option>
                    <option value="Others"> {{ _("Otros") }} </option>
                </select>
                <svg class="field-icon category-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
            </div>
        </div>
        {% endif %}

        {% if custom_signup_content %}
        <div class="form-group terms-group">
            <div class="checkbox">
                <label class="sb-checkbox-label">
                    <span class="input-area">
                    <input type="checkbox" autocomplete="off" class="input-with-feedback"
                        data-fieldtype="Check" data-fieldname="terms" id="signup-terms" required>
                    </span>
                    <span class="label-area">
                    {{ custom_signup_content }}
                    </span>
                </label>
            </div>
        </div>
        {% endif %}
    </div>
    <div class="page-card-actions">
        <button class="btn btn-sm btn-primary btn-block btn-signup sb-btn-login"
            type="submit">{{ _("Crear cuenta") }}</button>

        <p class="text-center sign-up-message">
            <a href="#login" class="blue">{{ _("¿Ya tienes cuenta? Inicia sesión") }}</a>
        </p>
    </div>
</form>

<script>
    frappe.ready(function () {
        // Autofill referral code if present
        const urlParams = new URLSearchParams(window.location.search);
        let refCode = urlParams.get('ref');
        
        if (!refCode) {
            // Try to get from cookie
            const match = document.cookie.match(new RegExp('(^| )studybadge_ref=([^;]+)'));
            if (match) {
                refCode = match[2];
            }
        }
        
        if (refCode) {
            $("#signup_ref_code").val(refCode);
        }

        $("#user_category").on("change", (e) => {
            style_category(e);
        });

        $(".signup-form").on("submit", (e) => {
            signup(e);
        });
    });

    const style_category = (e) => {
        let category_color = $(e.currentTarget).val() ? "var(--text-color)" : "var(--text-muted)";
        $("#user_category").css("color", category_color);
    }

    const signup = (e) => {
        e.preventDefault();
        const email = ($("#signup_email").val() || "").trim();
        const full_name = frappe.utils.xss_sanitise(($("#signup_fullname").val() || "").trim());
        const ref_code = frappe.utils.xss_sanitise(($("#signup_ref_code").val() || "").trim());

        if (ref_code) {
            document.cookie = "studybadge_ref=" + ref_code + "; path=/; max-age=" + (30*24*60*60);
        }

        if (!email || !validate_email(email) || !full_name) {
            login.set_status('{{ _("Valid email and name required") }}', 'red');
            return false;
        }

        frappe.call({
            method: "lms.lms.user.sign_up",
            args: {
                "email": email,
                "full_name": full_name,
                "verify_terms": $("#signup-terms").prop("checked") ? 1 : 0,
                "user_category": $("#user_category").length ?  $("#user_category").val() : ""
            },
            statusCode: login.login_handlers
        })
        return false;
    }
</script>
